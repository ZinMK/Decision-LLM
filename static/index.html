<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Model Chat Bot</title>
<style>
  :root {
    --bg: #ffffff; --text: #111113; --muted: #6e6e76; --faint: #a4a4ab;
    --line: #ececee; --soft: #f4f4f5; --accent: #2563eb; --accent-soft: #e8efff;
    --good: #16a34a; --bad: #dc2626;
    --jev: #111113; --clef: #f38020;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans);
         -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

  header { padding: 18px 16px 14px; text-align: center; border-bottom: 1px solid var(--line); flex: none; }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

  #chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 1040px; margin: 0 auto; padding: 32px 16px 24px; }

  .welcome { text-align: center; padding: 12vh 0 0; }
  .welcome h2 { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 24px; }
  .welcome p { color: var(--muted); margin: 0 auto 28px; max-width: 480px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .examples button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  .examples button:hover { background: var(--soft); }

  .user { display: flex; justify-content: flex-end; margin: 0 0 22px; }
  .user div { background: var(--soft); padding: 10px 16px; border-radius: 20px 20px 6px 20px;
              font-size: 17px; max-width: 80%; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 0 40px; }
  .bot { border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px 18px; min-width: 0; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .logo { flex: none; height: 28px; width: auto; display: block; }
  .logo.square { width: 28px; border-radius: 7px; }
  .logo:not(.square) { height: 20px; margin: 4px 0; }
  .who b { font-size: 15px; font-weight: 650; }
  .who span { font-size: 13px; color: var(--muted); }
  .text { font-size: 20px; line-height: 1.55; letter-spacing: -0.005em; min-height: 31px;
          white-space: pre-wrap; word-break: break-word; }
  .text .tentative { color: var(--faint); }
  .cursor { display: inline-block; width: 2px; height: 22px; background: var(--accent); margin-left: 2px;
            vertical-align: -4px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Live view of the decision the model just made */
  .live { margin-top: 14px; background: var(--soft); border-radius: 12px; padding: 11px 13px; }
  .live .what { font-size: 14px; color: var(--muted); margin-bottom: 8px; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  .live .what b { color: var(--text); font-weight: 600; }
  .opts { display: grid; gap: 6px; }
  .opt { display: grid; grid-template-columns: minmax(60px, 120px) 1fr 40px; gap: 10px; align-items: center; font-size: 14px; }
  .opt .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .opt .track { display: block; height: 6px; background: #e4e4e7; border-radius: 3px; overflow: hidden; }
  .opt .fill { display: block; height: 100%; background: #c4c4c9; border-radius: 3px; transition: width .2s ease; }
  .opt .p { text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
  .opt.top .k { color: var(--text); font-weight: 600; }
  .opt.top .fill { background: var(--accent); }
  .opt.top .p { color: var(--text); }

  .meta { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .meta .ok { color: var(--good); font-weight: 600; }
  .meta .warn { color: var(--bad); font-weight: 600; }
  .meta button { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }

  .breakdown { margin-top: 12px; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row .w { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .row .w small { display: block; font-weight: 400; color: var(--faint); font-size: 12px; }
  .row .alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill { padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 13px; }
  .pill.top { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .composer { flex: none; padding: 12px 16px 22px; background: linear-gradient(transparent, var(--bg) 30%); }
  form { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center;
         border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 20px;
         box-shadow: 0 4px 24px rgba(0, 0, 0, .06); background: var(--bg); }
  input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 17px; background: transparent; color: var(--text); }
  input::placeholder { color: var(--faint); }
  .send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
          background: var(--text); color: #fff; display: grid; place-items: center; }
  .send:disabled { background: #d4d4d8; cursor: default; }
  .send svg { width: 18px; height: 18px; }
  .hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }

  @media (max-width: 760px) {
    .pair { grid-template-columns: 1fr; }
    .text { font-size: 18px; }
    .row { grid-template-columns: 96px 1fr; }
    .welcome h2 { font-size: 24px; }
  }
</style>
</head>
<body>
<header>
  <h1>Decision Model Chat Bot</h1>
  <p>One question, two decision models. Every word is chosen by the model. No text generator.</p>
</header>

<div id="chat"><div class="thread" id="thread">
</div></div>

<div class="composer">
  <form id="form" autocomplete="off">
    <input id="q" type="text" placeholder="Ask a question or make a request" autofocus>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</div>

const SEND = $("send").innerHTML;
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
let runs = [];  // the answers currently streaming

const busy = () => runs.some((r) => r.source);
$("q").oninput = () => { if (!busy()) $("send").disabled = !$("q").value.trim(); };
$("form").onsubmit = (e) => {
  e.preventDefault();
  if (busy()) runs.forEach((r) => r.source && finish(r, "", "Stopped."));
  else ask();
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function ask() {
  const question = $("q").value.trim();
  if (!question || busy()) return;
  $("welcome")?.remove();
  $("q").value = "";

  const user = el("div", "user"); user.appendChild(el("div", "", question));
  const pair = el("div", "pair");
  $("thread").append(user, pair);
  runs = MODELS.map((model) => start(model, question, pair));
  $("send").innerHTML = STOP; $("send").disabled = false; $("send").setAttribute("aria-label", "Stop");
  scrollDown();
}

function start(model, question, pair) {
  const bot = el("div", "bot");
  const who = el("div", "who");
  const logo = el("img", model.square ? "logo square" : "logo");
  logo.src = model.logo; logo.alt = model.by;
  who.append(logo, el("b", "", model.name));
  const text = el("div", "text"), live = el("div", "live"), meta = el("div", "meta");
  live.append(el("div", "what", "Thinking about the first word…"), el("div", "opts"));
  bot.append(who, text, live, meta);
  pair.appendChild(bot);

  const r = { model, steps: [], text, live, meta, bot, source: null };
  renderText(r, true);
  r.source = new EventSource("/generate?" + new URLSearchParams({ q: question, model: model.id }));
  r.source.addEventListener("step", (e) => {
    const s = JSON.parse(e.data);
    r.steps.push(s);
    renderText(r, true);
    renderLive(r, s);
    scrollDown();
  });
  r.source.addEventListener("done", (e) => {
    const d = JSON.parse(e.data);
    const head = d.complete ? `<span class="ok">✓ Answer complete</span>` : `<span class="warn">Stopped before finishing</span>`;
    finish(r, `${head}<span>${d.calls} decisions</span><span>${d.seconds}s</span>`);
  });
  r.source.addEventListener("failed", (e) => finish(r, "", JSON.parse(e.data).message));
  r.source.onerror = () => { if (r.source) finish(r, "", "Connection lost. Is server.py running?"); };
  return r;
}

function finish(r, html, message) {
  if (r.source) { r.source.close(); r.source = null; }
  renderText(r, false);
  if (!r.steps.length) r.text.remove();
  r.live.remove();
  r.meta.innerHTML = html;
  if (message) r.meta.prepend(el("span", "warn", message));
  if (wordRows(r).length) {
    const b = el("button", "", "How it chose each word");
    b.type = "button";
    b.onclick = () => toggleBreakdown(r, b);
    r.meta.appendChild(b);
  }
  if (!busy()) {
    $("send").innerHTML = SEND; $("send").setAttribute("aria-label", "Send");
    $("send").disabled = !$("q").value.trim();
    $("q").focus();
  }
  scrollDown();
}

// Locked progress in normal text; letters the model may still delete are lighter.
function renderText(r, running) {
  const s = r.steps[r.steps.length - 1];
  r.text.innerHTML = "";
  if (s) {
    const locked = running ? s.locked : s.answer.length;
    r.text.append(document.createTextNode(s.answer.slice(0, locked)), el("span", "tentative", s.answer.slice(locked)));
  }
  if (running) r.text.appendChild(el("span", "cursor"));
}

const LABEL = { finished: "word is done", backspace: "delete a letter", end: "end the sentence",
                none_fit: "no word fits", delete_word: "delete the word" };
const label = (k) => LABEL[k] || k;

function renderLive(r, s) {
  const word = (s.answer.trimEnd().split(" ").pop() || "").replace(/\.$/, "");
  let html;
  if (s.key === "pick") html = `Typed <b>“${esc(s.typed)}”</b> → picked <b>“${esc(s.target)}”</b> from ${s.pool.toLocaleString()} words`;
  else if (s.key === "space") html = `<b>“${esc(word)}”</b> fits. On to the next word`;
  else if (s.key === "delete_word") html = `Took a word back: it didn't fit`;
  else if (s.key === "backspace") html = `Deleted a letter`;
  else if (s.key === "done") html = `<b>The sentence is complete</b>`;
  else if (s.target && word === s.target) html = `Checking <b>“${esc(word)}”</b>`;
  else html = `Typing the next letter`;
  r.live.querySelector(".what").innerHTML = html;

  const opts = r.live.querySelector(".opts");
  opts.innerHTML = "";
  const chosen = s.key === "pick" ? s.target : s.key === "space" ? "finished" : s.key === "done" ? "end" : s.key;
  for (const [k, p] of s.letters.slice(0, 3)) {
    const row = el("div", "opt" + (k === chosen ? " top" : ""));
    const track = el("span", "track"), fill = el("span", "fill");
    fill.style.width = `${(p * 100).toFixed(1)}%`;
    track.appendChild(fill);
    row.append(el("span", "k", label(k)), track, el("span", "p", `${Math.round(p * 100)}%`));
    opts.appendChild(row);
  }
}

// One row per word of the final answer: the word pick that produced it.
function wordRows(r) {
  const last = r.steps[r.steps.length - 1];
  if (!last) return [];
  const picks = new Map();  // word start position -> last pick step there
  let endStep = null;
  for (const s of r.steps) {
    if (s.key === "pick") picks.set(s.answer.lastIndexOf(" ") + 1, s);
    if (s.key === "done" && s.letters.some(([k]) => k === "end")) endStep = s;
  }
  const rows = [];
  for (const m of last.answer.matchAll(/[A-Za-z]+/g)) {
    const s = picks.get(m.index);
    if (s) rows.push({ word: m[0], step: s });
  }
  if (endStep) rows.push({ word: "(end)", step: endStep, end: true });
  return rows;
}

function toggleBreakdown(r, button) {
  const open = r.bot.querySelector(".breakdown");
  if (open) { open.remove(); button.textContent = "How it chose each word"; return; }
  const box = el("div", "breakdown");
  for (const row of wordRows(r)) {
    const line = el("div", "row");
    const w = el("div", "w", row.word);
    if (row.step.pool) w.appendChild(el("small", "", `typed “${row.step.typed}” · from ${row.step.pool.toLocaleString()} words`));
    const alts = el("div", "alts");
    for (const [k, p] of row.step.letters.slice(0, 4)) {
      const top = row.end ? k === "end" : k === row.step.target;
      alts.appendChild(el("span", "pill" + (top ? " top" : ""), `${label(k)} ${Math.round(p * 100)}%`));
    }
    line.append(w, alts);
    box.appendChild(line);
  }
  r.bot.appendChild(box);
  button.textContent = "Hide";
}

// Open /?q=Your+question to ask straight away (handy for recording).
const preset = new URLSearchParams(location.search).get("q");
if (preset) { $("q").value = preset; ask(); }

function scrollDown() { $("chat").scrollTop = $("chat").scrollHeight; }
function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
